[project]
name = "anonimato"
version = "2.0.0"
description = "Anonimización local de PDF e imágenes, sin rastro"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymupdf>=1.26",
  "pikepdf>=9",
  "pywebview>=5",
  "numpy>=2",
  "pillow>=11",
  "opencv-python-headless>=4.10",
  "onnxruntime-directml>=1.20",
  "tokenizers>=0.20",
  "rapidfuzz>=3",
  "regex>=2026.9.10",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
    "onnx>=1.23.0",
    "pyarrow>=25.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
