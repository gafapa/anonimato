name: Compilar y probar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
    env:
      PYTHONIOENCODING: utf-8
      ANONIMATO_CPU: "1"          # CI machines have no usable GPU
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Paquetes del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfuse2t64 fonts-dejavu-core \
            libxcb-cursor0 libvulkan1

      - name: Modelos (caché)
        uses: actions/cache@v4
        with:
          path: |
            models/base
            runtime
          key: models-${{ runner.os }}-${{ hashFiles('models/manifest.json') }}

      - name: Dependencias y modelos
        run: |
          uv sync --frozen
          uv run python tools/fetch_models.py base runtime

      - name: Integridad de modelos y runtime
        run: uv run python -c "from app.engine import models; bad = models.verify_all(force=True); print(bad); assert not bad"

      - name: Tests
        run: |
          uv run python -m tests.fixtures.generate
          uv run python -m pytest tests -q -p no:cacheprovider --durations=10

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          powershell -ExecutionPolicy Bypass -File packaging/build.ps1
          $dir = Join-Path $env:RUNNER_TEMP 'AnonimatoInstall'
          $setup = Get-ChildItem dist/AnonimatoSetup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"" -Wait
          $p = Start-Process "$dir/Anonimato.exe" -ArgumentList "--selftest=$pwd/dist/selftest-windows.json" -Wait -PassThru
          Get-Content dist/selftest-windows.json
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Paquete (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/build_macos.sh

      - name: Paquete (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: anonimato-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/selftest-*.json
          if-no-files-found: error
